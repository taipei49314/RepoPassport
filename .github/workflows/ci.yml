name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go integrity, identity, release build, vulnerability, format, vet, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Scan application module graph
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -C cmd/repopass -scan module

      - name: Scan source and test symbols
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -test ./...

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test all packages, including module and release identity
        run: go test -count=1 ./...

      - name: Compile integration-tagged container tests without executing containers
        run: go test -count=1 -tags=integration ./internal/cli -run '^$'

      - name: Build and qualify release artifacts from the exact checkout
        shell: pwsh
        run: |
          $testedRevision = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $testedRevision -cnotmatch '^[0-9a-f]{40}$') {
            throw 'unable to bind release qualification to checkout HEAD'
          }
          & ./scripts/build-release.ps1 -Version 0.1.0-alpha.33 -TestedRevision $testedRevision

      - name: Rebuild and byte-compare release artifacts from a second clean source
        id: release-reproducibility
        shell: pwsh
        run: |
          $testedRevision = (git rev-parse --verify HEAD).Trim()
          $testedTree = (git rev-parse --verify 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or
              $testedRevision -cnotmatch '^[0-9a-f]{40}$' -or
              $testedTree -cnotmatch '^[0-9a-f]{40}$') {
            throw 'unable to bind release reproducibility to checkout source'
          }
          & ./scripts/compare-release-rebuild.ps1 `
            -TestedRevision $testedRevision `
            -TestedTree $testedTree

  schema-json:
    name: Schema JSON syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Parse schema and fixture JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          schemas = sorted(Path("schemas").rglob("*.json"))
          if not schemas:
              raise SystemExit("no JSON schemas found under schemas/")

          fixture_json = sorted(Path("testdata/fixtures").rglob("*.json"))
          paths = schemas + fixture_json

          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"valid JSON: {path}")
          PY

  windows-go:
    name: Windows identity, release build, test, and cross-process lock stress
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Test all packages, including module and release identity
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: go test -count=1 ./...

      - name: Build and qualify release artifacts from the exact checkout
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $testedRevision = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $testedRevision -cnotmatch '^[0-9a-f]{40}$') {
            throw 'unable to bind release qualification to checkout HEAD'
          }
          & ./scripts/build-release.ps1 -Version 0.1.0-alpha.33 -TestedRevision $testedRevision

      - name: Stress cross-process state locking
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          go test -count=20 -timeout=10m
          ./internal/releasestate
          ./internal/trustchainstate
          ./internal/trustrotationstate
          ./internal/truststate
          -run '^(TestObserveContextAndTimeoutBoundLockContention|TestObserveChainStateConcurrencyCancellationAndProcessContention|TestObserveContentionAndCancellationLeaveStateUnchanged|TestObserveCrossProcessLockTimeoutAndExitRelease)$'

  container-integration:
    name: Container healthy journeys (${{ matrix.backend }})
    needs:
      - go
      - schema-json
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend:
          - docker
          - podman

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Bind the check to the exact clean source tree
        id: source-binding
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse --verify HEAD)"
          source_tree="$(git rev-parse --verify HEAD^{tree})"
          dirty="$(git status --porcelain --untracked-files=all)"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid expected source SHA: $EXPECTED_SOURCE_SHA" >&2
            exit 1
          fi
          if [[ ! "$actual_sha" =~ ^[0-9a-f]{40}$ || ! "$source_tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'checkout did not resolve to canonical SHA-1 commit and tree identities' >&2
            exit 1
          fi
          if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "checkout SHA $actual_sha does not match event SHA $EXPECTED_SOURCE_SHA" >&2
            exit 1
          fi
          if [[ -n "$dirty" ]]; then
            echo "checkout is dirty:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          kernel="$(uname -srvmo)"
          runner_os="$(uname -s)"
          runner_arch="$(uname -m)"
          cgroup="$(stat -fc %T /sys/fs/cgroup)"
          if [[ "$runner_os" != 'Linux' || "$runner_arch" != 'x86_64' ]]; then
            echo "runner machine is $runner_os/$runner_arch, want Linux/x86_64" >&2
            exit 1
          fi
          if [[ "$cgroup" != 'cgroup2fs' ]]; then
            echo "runner cgroup filesystem is $cgroup, want cgroup2fs" >&2
            exit 1
          fi
          annotation="$(jq -cn \
            --arg cgroup "$cgroup" \
            --arg imageOS "${ImageOS:-unknown}" \
            --arg imageVersion "${ImageVersion:-unknown}" \
            --arg kernel "$kernel" \
            --arg machineArch "$runner_arch" \
            --arg machineOS "$runner_os" \
            --arg sourceSHA "$actual_sha" \
            --arg sourceTree "$source_tree" \
            '{"dirty":false,"kind":"container-healthy-journey-source-annotation","sourceSHA":$sourceSHA,"sourceTree":$sourceTree,"runner":{"ImageOS":$imageOS,"ImageVersion":$imageVersion,"machineOS":$machineOS,"machineArch":$machineArch,"kernel":$kernel,"cgroup":$cgroup},"trustBoundary":"non-versioned-ci-check-not-trusted-evidence"}')"
          printf 'REPOPASS_M1_JOURNEY_SOURCE %s\n' "$annotation"

      - name: Prepare exact approved fixture images on the selected backend
        id: prepare-images
        env:
          CONTAINER_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail

          case "$CONTAINER_BACKEND" in
            docker)
              command -v docker
              engine_version="$(docker version --format '{{.Client.Version}}/{{.Server.Version}}')"
              security_options="$(docker info --format '{{json .SecurityOptions}}')"
              if [[ "$security_options" == *rootless* ]]; then
                echo 'Docker healthy journeys require the hosted rootful Docker engine' >&2
                exit 1
              fi
              engine_platform="$(docker info --format '{{.OSType}}/{{.Architecture}} cgroup={{.CgroupVersion}}')"
              if [[ "$engine_platform" != 'linux/x86_64 cgroup=2' ]]; then
                echo "Docker engine tuple is $engine_platform, want linux/x86_64 cgroup=2" >&2
                exit 1
              fi
              ;;
            podman)
              command -v podman
              if [[ "$(id -u)" -eq 0 ]]; then
                echo 'Podman healthy journeys must run as the non-root runner user' >&2
                exit 1
              fi
              engine_version="$(podman version --format '{{.Client.Version}}')"
              podman_info="$(podman info --format json)"
              if ! jq -e '
                .host.os == "linux" and
                .host.arch == "amd64" and
                .host.security.rootless == true and
                .host.serviceIsRemote == false and
                .host.cgroupVersion == "v2"
              ' <<< "$podman_info" >/dev/null; then
                echo 'Podman healthy journeys require the runner-user rootless engine' >&2
                exit 1
              fi
              engine_platform="$(jq -r '.host.os + "/" + .host.arch + " cgroup=" + .host.cgroupVersion' <<< "$podman_info")"
              ;;
            *)
              echo "unsupported container backend: $CONTAINER_BACKEND" >&2
              exit 1
              ;;
          esac
          printf 'REPOPASS_M1_JOURNEY_ENGINE backend=%s version=%s platform=%s\n' \
            "$CONTAINER_BACKEND" "$engine_version" "$engine_platform"

          node_image='docker.io/library/node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3'
          node_transport='docker.io/library/node@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3'
          node_index='sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3'
          node_amd64='sha256:8607a9064d4a571140998ae9e52a3b3fcf9cff361d04642d5971e6cd76d39e27'
          python_image='docker.io/library/python:3.12.13-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de'
          python_transport='docker.io/library/python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de'
          python_index='sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de'
          python_amd64='sha256:cab2dbf575e971934a81e4622f5aba17aa7929719bd7e31033a3a83b97fd0464'
          receipt_dir="$RUNNER_TEMP/repopass-m1-images-$CONTAINER_BACKEND"
          mkdir -p "$receipt_dir"
          command -v skopeo

          verify_image() {
            local name="$1"
            local image="$2"
            local transport="$3"
            local expected_index="$4"
            local expected_amd64="$5"
            local raw="$receipt_dir/$name-index.json"
            local inspect="$receipt_dir/$name-inspect.json"

            skopeo inspect --raw "docker://$transport" > "$raw"
            actual_index="sha256:$(sha256sum "$raw" | awk '{print $1}')"
            if [[ "$actual_index" != "$expected_index" ]]; then
              echo "$name raw OCI index digest is $actual_index, want $expected_index" >&2
              exit 1
            fi
            selected_amd64="$(jq -er '
              [.manifests[]
               | select(.platform.os == "linux" and
                        .platform.architecture == "amd64")
               | .digest]
              | if length == 1 then .[0]
                else error("linux/amd64 manifest cardinality is not one")
                end
            ' "$raw")"
            if [[ "$selected_amd64" != "$expected_amd64" ]]; then
              echo "$name linux/amd64 manifest is $selected_amd64, want $expected_amd64" >&2
              exit 1
            fi

            "$CONTAINER_BACKEND" pull --platform linux/amd64 "$image"
            "$CONTAINER_BACKEND" image inspect "$image" > "$inspect"
            platform="$("$CONTAINER_BACKEND" image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            if [[ "$platform" != 'linux/amd64' ]]; then
              echo "image $image resolved to $platform, want linux/amd64" >&2
              exit 1
            fi
            printf 'REPOPASS_M1_JOURNEY_IMAGE name=%s index=%s linux-amd64=%s backend=%s\n' \
              "$name" "$actual_index" "$selected_amd64" "$CONTAINER_BACKEND"
          }

          verify_image node "$node_image" "$node_transport" "$node_index" "$node_amd64"
          verify_image python "$python_image" "$python_transport" "$python_index" "$python_amd64"

      - name: Run only the named healthy container journeys
        id: healthy-journeys
        env:
          REPOPASS_INTEGRATION_BACKEND: ${{ matrix.backend }}
        run: go test -timeout=25m -tags=integration -count=1 -v ./internal/cli -run '^TestContainerHealthyJourneys$'

      - name: Fail on RepoPassport-labeled container residue
        id: residue-check
        if: ${{ always() }}
        env:
          CONTAINER_BACKEND: ${{ matrix.backend }}
        shell: bash
        run: |
          set -euo pipefail
          command -v "$CONTAINER_BACKEND"
          residue="$("$CONTAINER_BACKEND" ps -aq --filter label=dev.repopass.run)"
          if [[ -n "$residue" ]]; then
            echo 'RepoPassport-labeled container residue remains:' >&2
            "$CONTAINER_BACKEND" ps -a --no-trunc --filter label=dev.repopass.run >&2
            while IFS= read -r container_id; do
              [[ -z "$container_id" ]] || "$CONTAINER_BACKEND" container inspect \
                --format '{{json .Id}} {{json .Name}} {{json .State.Status}} {{json .Config.Labels}}' \
                "$container_id" >&2
            done <<< "$residue"
            exit 1
          fi

  acceptance-registry:
    name: Machine-verifiable acceptance registry
    needs:
      - go
      - schema-json
      - windows-go
      - container-integration
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact source
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up exact Go
        id: setup-go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.26.5'
          cache: false

      - name: Bind acceptance to the exact clean source tree
        id: source-binding
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse --verify HEAD)"
          tree_sha="$(git rev-parse --verify 'HEAD^{tree}')"
          status="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          [[ "$head_sha" == "$GITHUB_SHA" ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$status" ]]
          printf 'tree-sha=%s\n' "$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Derive the bounded producer-owned evaluation
        id: evaluate
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance-evaluation-v1.json
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
          GO_RESULT: ${{ needs.go.result }}
          SCHEMA_JSON_RESULT: ${{ needs.schema-json.result }}
          WINDOWS_GO_RESULT: ${{ needs.windows-go.result }}
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          tree_sha="$(git rev-parse --verify 'HEAD^{tree}')"
          go run ./cmd/repopass-acceptance-registry evaluate \
            --registry acceptance-registry.json \
            --repository github.com/taipei49314/RepoPassport \
            --revision "$GITHUB_SHA" \
            --tree-sha "$tree_sha" \
            --event "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --go-result "$GO_RESULT" \
            --schema-json-result "$SCHEMA_JSON_RESULT" \
            --windows-go-result "$WINDOWS_GO_RESULT" \
            --container-result "$CONTAINER_RESULT" \
            --output "$ACCEPTANCE_OUTPUT"

      - name: Independently replay the evaluation bytes
        id: verify-evaluation
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance-evaluation-v1.json
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
          EXPECTED_TREE_SHA: ${{ steps.source-binding.outputs.tree-sha }}
          GO_RESULT: ${{ needs.go.result }}
          SCHEMA_JSON_RESULT: ${{ needs.schema-json.result }}
          WINDOWS_GO_RESULT: ${{ needs.windows-go.result }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import stat

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError('duplicate JSON object name')
                  value[key] = item
              return value

          registry_path = pathlib.Path('acceptance-registry.json')
          evaluation_path = pathlib.Path(os.environ['ACCEPTANCE_OUTPUT'])

          def read_bounded_regular(path, maximum):
              metadata = path.lstat()
              if (not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 1 or
                      metadata.st_size < 1 or metadata.st_size > maximum):
                  raise SystemExit('acceptance input metadata is invalid')
              raw = path.read_bytes()
              after = path.lstat()
              if (metadata.st_dev, metadata.st_ino, metadata.st_size) != (
                      after.st_dev, after.st_ino, after.st_size
              ) or len(raw) != metadata.st_size:
                  raise SystemExit('acceptance input changed')
              return raw

          registry_raw = read_bounded_regular(registry_path, 256 * 1024)
          evaluation_raw = read_bounded_regular(evaluation_path, 1024 * 1024)
          registry = json.loads(registry_raw, object_pairs_hook=reject_duplicates)
          document = json.loads(evaluation_raw, object_pairs_hook=reject_duplicates)
          canonical_registry = json.dumps(registry, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode()
          canonical_evaluation = json.dumps(document, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode()
          if canonical_registry != registry_raw or canonical_evaluation != evaluation_raw:
              raise SystemExit('acceptance JSON is not canonical')
          expected_ids = [
              'RP-B00', 'RP-B01', 'RP-B02', 'RP-B03', 'RP-B04',
              'RP-M0-CORPUS', 'RP-M0-MODULE', 'RP-M0-QUAL', 'RP-M0-SPEC',
              'RP-M1-JOURNEY',
              'RP-M2-COVERAGE', 'RP-M2-MATRIX', 'RP-M2-RESIDUE', 'RP-M2-VERDICT',
              'RP-M3-IDENTITY', 'RP-M3-INTEGRITY', 'RP-M3-PORTABLE', 'RP-M3-PRIVACY',
              'RP-M4-CHECK', 'RP-M4-FORK', 'RP-M4-REPRO',
              'RP-M5-JOURNEY', 'RP-M5-SECURITY', 'RP-M5-TRUTH',
              'RP-M6-AUTHORITY', 'RP-M6-CLEANUP', 'RP-M6-ISOLATION', 'RP-M6-LIVE',
              'RP-M7-CAPABILITY', 'RP-M7-CONFORMANCE', 'RP-M7-SUPPLYCHAIN',
              'RP-Q-PROTOCOL', 'RP-Q-REPLAY', 'RP-Q-SUBJECT', 'RP-Q-VERDICT',
              'RP-REGISTRY', 'RP-R-STABLE-SCHEMA',
          ]
          if (set(registry) != {'artifactType', 'product', 'rows', 'schemaVersion'} or
                  registry['artifactType'] != 'repopass-acceptance-registry' or
                  registry['product'] != 'repopass' or registry['schemaVersion'] != '1' or
                  [row.get('id') for row in registry['rows']] != expected_ids):
              raise SystemExit('registry identity or exact row set differs')
          for row in registry['rows']:
              if set(row) != {'appliesTo', 'criterion', 'evaluation', 'id', 'milestone', 'required'} or row['required'] is not True:
                  raise SystemExit('registry row shape differs')
              if row['id'] == 'RP-B00':
                  expected_policy = {'kind': 'required-checks', 'requiredChecks': ['ci/container-matrix', 'ci/go', 'ci/schema-json', 'ci/windows-go']}
              elif row['id'] in {'RP-B04', 'RP-M1-JOURNEY'}:
                  expected_policy = {'kind': 'required-checks', 'requiredChecks': ['ci/container-matrix']}
              elif row['id'] == 'RP-M0-MODULE':
                  expected_policy = {'kind': 'required-checks', 'requiredChecks': ['ci/go', 'ci/windows-go']}
              elif row['id'] == 'RP-M0-QUAL':
                  expected_policy = {'kind': 'blocked', 'reasonCode': 'SOURCE_QUALIFICATION_PREREQUISITES_UNAVAILABLE'}
              else:
                  expected_policy = {'kind': 'not-run', 'reasonCode': 'ROADMAP_WORK_NOT_SCHEDULED'}
              if row['evaluation'] != expected_policy:
                  raise SystemExit('registry evaluation policy differs')
          if set(document) != {
              'artifactType', 'evaluationDigest', 'formalClaim', 'overallStatus',
              'registryDigest', 'rows', 'run', 'schemaVersion', 'stableEligible',
              'subject', 'trustBoundary'
          }:
              raise SystemExit('evaluation keys differ')
          registry_digest = 'sha256:' + hashlib.sha256(registry_raw).hexdigest()
          if document['registryDigest'] != registry_digest:
              raise SystemExit('registryDigest differs')
          digest_input = dict(document)
          actual_digest = digest_input.pop('evaluationDigest')
          canonical_input = json.dumps(digest_input, ensure_ascii=False, separators=(',', ':'), sort_keys=True).encode()
          expected_digest = 'sha256:' + hashlib.sha256(b'repopass.acceptance-evaluation.v1\x00' + canonical_input).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit('evaluationDigest differs')
          if document['artifactType'] != 'repopass-acceptance-evaluation' or document['schemaVersion'] != '1':
              raise SystemExit('evaluation identity differs')
          if document['formalClaim'] is not False or document['trustBoundary'] != 'producer-owned-ci':
              raise SystemExit('evaluation trust boundary differs')
          current_results = {
              os.environ['CONTAINER_RESULT'], os.environ['GO_RESULT'],
              os.environ['SCHEMA_JSON_RESULT'], os.environ['WINDOWS_GO_RESULT'],
          }
          expected_overall = 'FAIL' if current_results & {'failure', 'cancelled'} else 'INCOMPLETE'
          if document['stableEligible'] is not False or document['overallStatus'] != expected_overall:
              raise SystemExit('initial evaluation overstates roadmap completion')
          if document['subject'] != {
              'repository': 'github.com/taipei49314/RepoPassport',
              'revision': os.environ['GITHUB_SHA'],
              'treeSHA': os.environ['EXPECTED_TREE_SHA'],
          }:
              raise SystemExit('evaluation subject differs')
          if document['run'] != {
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'event': os.environ['GITHUB_EVENT_NAME'],
              'id': int(os.environ['GITHUB_RUN_ID']),
              'ref': os.environ['GITHUB_REF'],
              'workflowPath': '.github/workflows/ci.yml',
          }:
              raise SystemExit('evaluation run differs')
          if len(document['rows']) != 37 or [row['id'] for row in document['rows']] != expected_ids:
              raise SystemExit('evaluation row scope differs')
          statuses = {row['id']: row['status'] for row in document['rows']}
          if statuses['RP-M0-QUAL'] != 'BLOCKED':
              raise SystemExit('RP-M0-QUAL is not blocked')
          required_results = {
              'ci/container-matrix': os.environ['CONTAINER_RESULT'],
              'ci/go': os.environ['GO_RESULT'],
              'ci/schema-json': os.environ['SCHEMA_JSON_RESULT'],
              'ci/windows-go': os.environ['WINDOWS_GO_RESULT'],
          }
          for row, policy in zip(document['rows'], (item['evaluation'] for item in registry['rows'])):
              if set(row) != {'evidence', 'id', 'reasonCode', 'status'}:
                  raise SystemExit('row evaluation keys differ')
              if policy['kind'] == 'blocked':
                  expected = ([], policy['reasonCode'], 'BLOCKED')
              elif policy['kind'] == 'not-run':
                  expected = ([], policy['reasonCode'], 'NOT_RUN')
              else:
                  expected_evidence = [
                      {'checkId': check_id, 'result': required_results[check_id]}
                      for check_id in policy['requiredChecks']
                  ]
                  results = [item['result'] for item in expected_evidence]
                  if row['id'] == 'RP-B00' and not (
                      os.environ['GITHUB_EVENT_NAME'] == 'push' and
                      os.environ['GITHUB_REF'] == 'refs/heads/main'
                  ):
                      expected = (expected_evidence, 'NOT_DEFAULT_BRANCH', 'NOT_RUN')
                  elif 'failure' in results:
                      expected = (expected_evidence, 'REQUIRED_CHECK_FAILED', 'FAIL')
                  elif 'cancelled' in results:
                      expected = (expected_evidence, 'REQUIRED_CHECK_CANCELLED', 'FAIL')
                  elif 'skipped' in results:
                      expected = (expected_evidence, 'REQUIRED_CHECK_MISSING_OR_SKIPPED', 'NOT_RUN')
                  else:
                      expected = (expected_evidence, 'CURRENT_REQUIRED_CHECKS_PASSED', 'PASS')
              if (row['evidence'], row['reasonCode'], row['status']) != expected:
                  raise SystemExit('row evaluation semantics differ')
          expected_rollup = 'FAIL' if any(row['status'] == 'FAIL' for row in document['rows']) else 'INCOMPLETE'
          if document['overallStatus'] != expected_rollup:
              raise SystemExit('evaluation roll-up differs')
          PY
          head_sha="$(git rev-parse --verify HEAD)"
          tree_sha="$(git rev-parse --verify 'HEAD^{tree}')"
          status="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          [[ "$head_sha" == "$GITHUB_SHA" ]]
          [[ "$tree_sha" == "$EXPECTED_TREE_SHA" ]]
          [[ -z "$status" ]]

      - name: Retain the non-release evaluation transport
        id: upload-evaluation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repopass-acceptance-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-evaluation-v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed when any upstream required check was non-success
        id: fail-on-upstream
        if: ${{ always() }}
        env:
          CONTAINER_RESULT: ${{ needs.container-integration.result }}
          GO_RESULT: ${{ needs.go.result }}
          SCHEMA_JSON_RESULT: ${{ needs.schema-json.result }}
          WINDOWS_GO_RESULT: ${{ needs.windows-go.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GO_RESULT" != 'success' || \
                "$SCHEMA_JSON_RESULT" != 'success' || \
                "$WINDOWS_GO_RESULT" != 'success' || \
                "$CONTAINER_RESULT" != 'success' ]]; then
            exit 1
          fi
