name: zz-debug-source-dirty

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sq-debug-source-dirty

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: qualification-source
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          cache: false
          go-version: 1.26.6
      - shell: bash
        working-directory: ${{ github.workspace }}/qualification-source
        run: |
          set -euo pipefail
          dump_git_state() {
            local label="$1"
            echo "=== $label ==="
            echo "config.worktree=$(test -e .git/config.worktree && echo present || echo absent)"
            echo "--- git status porcelain ignored ---"
            git status --porcelain=v1 --ignored -uall || true
            echo "--- git config --local --list --show-origin ---"
            git config --local --list --show-origin || true
            echo "--- extra worktree files ---"
            git ls-files -o || true
            echo "--- forbidden metadata ---"
            for name in commondir gitdir config.worktree shallow; do
              ls -la ".git/$name" 2>/dev/null || echo ".git/$name absent"
            done
            ls -la .git/info/sparse-checkout 2>/dev/null || echo "sparse-checkout absent"
            ls -la .git/objects/info/alternates 2>/dev/null || echo "alternates absent"
          }

          rm -f .git/config.worktree
          test ! -e .git/config.worktree
          for name in go git pwsh gofmt uname; do
            path="$(command -v "$name")"
            target="$(readlink -f "$path")"
            sudo chmod go-w "$target"
            mode="$(stat -c '%a' "$target")"
            test "$((8#$mode & 8#022))" -eq 0
            echo "tool $name mode=$mode path=$target"
          done

          tested="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^1)"
          root="$(pwd)"
          echo "tested=$tested"
          echo "base=$base"
          echo "root=$root"
          echo "ImageVersion=${ImageVersion-}"
          echo "TMPDIR=${TMPDIR-}"
          echo "go_temp=$(go env TMPDIR)"

          dump_git_state "after checkout chmod drop"

          probe="$RUNNER_TEMP/zz-debug-inspect"
          go build -o "$probe" ./internal/sourcequalification/cmd/zz-debug-inspect

          echo "=== inspect 1 (before isolation) ==="
          set +e
          "$probe" "$root" "$base" "$tested"
          inspect1=$?
          set -e
          echo "inspect1_exit=$inspect1"
          dump_git_state "after inspect 1"

          echo "=== inspect 2 (idempotence, no isolation) ==="
          set +e
          "$probe" "$root" "$base" "$tested"
          inspect2=$?
          set -e
          echo "inspect2_exit=$inspect2"
          dump_git_state "after inspect 2"

          go_bin="$(readlink -f "$(command -v go)")"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          private="$RUNNER_TEMP/sq-debug-private"
          mkdir -m 700 "$private" "$private/home" "$private/go-cache" "$private/go-mod-cache" "$private/tmp"
          echo "=== privileged go version (production-like env) ==="
          sudo -n -- /usr/bin/unshare --pid --fork --kill-child=KILL --mount-proc --net -- \
            /usr/bin/setpriv --reuid="$runner_uid" --regid="$runner_gid" --clear-groups \
              --inh-caps=-all --ambient-caps=-all --bounding-set=-all --no-new-privs -- \
              /usr/bin/env -i -- \
                PATH="$(dirname "$go_bin"):/usr/bin:/bin" \
                HOME="$private/home" \
                USERPROFILE="$private/home" \
                XDG_CONFIG_HOME="$private/home" \
                TMPDIR="$private/tmp" \
                TMP="$private/tmp" \
                TEMP="$private/tmp" \
                LANG=C \
                LC_ALL=C \
                TZ=UTC \
                GOWORK=off \
                GOENV=off \
                GOTOOLCHAIN=local \
                GOFLAGS= \
                GOCACHEPROG= \
                GOTELEMETRY=off \
                GOCACHE="$private/go-cache" \
                GOMODCACHE="$private/go-mod-cache" \
                GOTMPDIR="$private/tmp" \
                GOAUTH=off \
                GONOPROXY=none \
                GOPRIVATE= \
                GONOSUMDB= \
                GOINSECURE= \
                GIT_CONFIG_NOSYSTEM=1 \
                GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_GLOBAL=/dev/null \
                GIT_ATTR_NOSYSTEM=1 \
                GIT_TERMINAL_PROMPT=0 \
                GIT_OPTIONAL_LOCKS=0 \
                GIT_NO_REPLACE_OBJECTS=1 \
                GIT_LITERAL_PATHSPECS=1 \
                GIT_PAGER= \
                PAGER= \
                GCM_INTERACTIVE=Never \
                GOPROXY=off \
                GOSUMDB=off \
                GOVULNDB=off \
                "$go_bin" version
          echo "go_version_exit=$?"
          dump_git_state "after privileged go version"

          echo "=== inspect 3 (after isolation) ==="
          set +e
          "$probe" "$root" "$base" "$tested"
          inspect3=$?
          set -e
          echo "inspect3_exit=$inspect3"
          dump_git_state "after inspect 3"

          echo "=== compile source-guard reproduction outside the worktree ==="
          go test -c -o "$RUNNER_TEMP/sq-debug-guard.test" ./internal/sourcequalification
          dump_git_state "after go test -c"
          echo "=== source-guard reproduction ==="
          mkdir -m 700 "$RUNNER_TEMP/sq-debug-guard-private" \
            "$RUNNER_TEMP/sq-debug-guard-private/home" \
            "$RUNNER_TEMP/sq-debug-guard-private/go-cache" \
            "$RUNNER_TEMP/sq-debug-guard-private/go-mod-cache" \
            "$RUNNER_TEMP/sq-debug-guard-private/tmp"
          set +e
          env SQ_DEBUG_SOURCE_GUARD=1 \
            SQ_DEBUG_REPO_ROOT="$root" \
            SQ_DEBUG_BASE="$base" \
            SQ_DEBUG_TESTED="$tested" \
            SQ_DEBUG_PRIVATE="$RUNNER_TEMP/sq-debug-guard-private" \
            "$RUNNER_TEMP/sq-debug-guard.test" -test.run TestDebugSourceGuardReproduction -test.v
          guard_exit=$?
          set -e
          echo "source_guard_exit=$guard_exit"
          dump_git_state "after source-guard reproduction"
