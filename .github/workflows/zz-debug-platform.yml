name: zz-debug-platform

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sq-debug-platform-config

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: qualification-source
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          cache: false
          go-version: 1.26.6
      - name: restrict-pwsh-write-bits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pwsh_path="$(command -v pwsh)"
          test -n "$pwsh_path"
          target="$(readlink -f "$pwsh_path")"
          test -n "$target"
          test -f "$target"
          sudo chmod go-w "$target"
          mode="$(stat -c '%a' "$target")"
          test "$((8#$mode & 8#022))" -eq 0
      - name: build-controller-linux
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/qualification-source
        shell: bash
        run: |
          set -euo pipefail
          umask
          mkdir -p "$RUNNER_TEMP/source-qualification-controller-debug"
          export CGO_ENABLED=0
          go build -trimpath -buildvcs=true \
            -o "$RUNNER_TEMP/source-qualification-controller-debug/repopass-source-qualify-linux-amd64" \
            ./internal/sourcequalification/cmd/repopass-source-qualify
          stat -c 'controller mode=%a uid=%u gid=%g nlink=%h path=%n' \
            "$RUNNER_TEMP/source-qualification-controller-debug/repopass-source-qualify-linux-amd64"
      - name: build-controller-windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/qualification-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PATH=$env:PATH"
          Get-Command go, git, pwsh | Format-List Name, Source, CommandType, Path
          $controllerRoot = Join-Path $env:RUNNER_TEMP 'source-qualification-controller-debug'
          [IO.Directory]::CreateDirectory($controllerRoot) | Out-Null
          $env:CGO_ENABLED = '0'
          $controller = Join-Path $controllerRoot 'repopass-source-qualify-windows-amd64.exe'
          go build -trimpath -buildvcs=true -o $controller ./internal/sourcequalification/cmd/repopass-source-qualify
          if ($LASTEXITCODE -ne 0) { throw 'controller build failed' }
          Get-Item $controller | Format-List FullName, Length, Mode, LinkType, Attributes
      - name: dump-platform-configuration
        working-directory: ${{ github.workspace }}/qualification-source
        env:
          SQ_DEBUG_REPO_ROOT: ${{ github.workspace }}/qualification-source
          SQ_DEBUG_CONTROLLER: ${{ runner.temp }}/source-qualification-controller-debug
        shell: bash
        run: |
          set -euo pipefail
          umask
          echo "PATH=$PATH"
          command -v go
          command -v git
          command -v pwsh
          go test -count=1 -run TestZZDebugPlatformConfigurationCI -v ./internal/sourcequalification/
