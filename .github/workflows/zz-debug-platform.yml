name: zz-debug-platform

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sq-debug-inspect-repo

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: qualification-source
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          cache: false
          go-version: 1.26.6
      - name: restrict-pwsh-write-bits
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pwsh_path="$(command -v pwsh)"
          test -n "$pwsh_path"
          target="$(readlink -f "$pwsh_path")"
          test -n "$target"
          test -f "$target"
          sudo chmod go-w "$target"
          mode="$(stat -c '%a' "$target")"
          test "$((8#$mode & 8#022))" -eq 0
      - name: build-controller-linux
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/qualification-source
        shell: bash
        run: |
          set -euo pipefail
          umask
          mkdir -p "$RUNNER_TEMP/source-qualification-controller-debug"
          export CGO_ENABLED=0
          go build -trimpath -buildvcs=true \
            -o "$RUNNER_TEMP/source-qualification-controller-debug/repopass-source-qualify-linux-amd64" \
            ./internal/sourcequalification/cmd/repopass-source-qualify
          stat -c 'controller mode=%a uid=%u gid=%g nlink=%h path=%n' \
            "$RUNNER_TEMP/source-qualification-controller-debug/repopass-source-qualify-linux-amd64"
          for path in /usr/bin/git /usr/bin/pwsh /usr/bin/uname \
            /opt/hostedtoolcache/go/1.26.6/x64/bin/go \
            /opt/hostedtoolcache/go/1.26.6/x64/bin/gofmt; do
            stat -c 'tool mode=%a uid=%u gid=%g nlink=%h type=%F name=%N' "$path" || true
          done
      - name: build-controller-windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/qualification-source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PATH=$env:PATH"
          Get-Command go, git, pwsh | Format-List Name, Source, CommandType, Path
          $controllerRoot = Join-Path $env:RUNNER_TEMP 'source-qualification-controller-debug'
          [IO.Directory]::CreateDirectory($controllerRoot) | Out-Null
          $env:CGO_ENABLED = '0'
          $controller = Join-Path $controllerRoot 'repopass-source-qualify-windows-amd64.exe'
          go build -trimpath -buildvcs=true -o $controller ./internal/sourcequalification/cmd/repopass-source-qualify
          if ($LASTEXITCODE -ne 0) { throw 'controller build failed' }
          Get-Item $controller | Format-List FullName, Length, Mode, LinkType, Attributes
      - name: dump-platform-configuration-linux
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}/qualification-source
        env:
          SQ_DEBUG_REPO_ROOT: ${{ github.workspace }}/qualification-source
          SQ_DEBUG_CONTROLLER: ${{ runner.temp }}/source-qualification-controller-debug
        shell: bash
        run: |
          set -euo pipefail
          umask
          echo "PATH=$PATH"
          command -v go
          command -v git
          command -v pwsh
          ls -la .git | sed -n '1,80p'
          if [ -e .git/config.worktree ]; then
            echo '--- config.worktree ---'
            wc -c .git/config.worktree
            cat -A .git/config.worktree || true
          else
            echo 'config.worktree absent'
          fi
          git config --show-origin --get-regexp 'extension|worktree|sparse' || true
          git config --local --list || true
          go test -count=1 -run TestZZDebugPlatformConfigurationCI -v ./internal/sourcequalification/
      - name: dump-platform-configuration-windows
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}/qualification-source
        env:
          SQ_DEBUG_REPO_ROOT: ${{ github.workspace }}/qualification-source
          SQ_DEBUG_CONTROLLER: ${{ runner.temp }}/source-qualification-controller-debug
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PATH=$env:PATH"
          Get-Command go, git, pwsh, gofmt | Format-List Name, Source, CommandType, Path
          Get-ChildItem -Force .git | Format-Table Name, Length, Mode, LinkType
          $worktree = Join-Path '.git' 'config.worktree'
          if (Test-Path $worktree) {
            Write-Host '--- config.worktree ---'
            Get-Item $worktree | Format-List FullName, Length, Attributes
            Get-Content -LiteralPath $worktree -Raw
          } else {
            Write-Host 'config.worktree absent'
          }
          git config --show-origin --get-regexp 'extension|worktree|sparse'
          git config --local --list
          go test -count=1 -run TestZZDebugPlatformConfigurationCI -v ./internal/sourcequalification/
          if ($LASTEXITCODE -ne 0) { throw 'platform dump failed' }
