apiVersion: repopass.dev/v1alpha1
kind: RepositoryPassport

metadata:
  name: alpha24-write-restore
  displayName: Alpha.24 Write Restore
  description: Setup creates a declared baseline; exercise mutates and restores that baseline outside its own declaration.
  labels:
    fixture: malicious

spec:
  project:
    kind: cli
    audiences:
      - developer
    entrypoints:
      - quickstart

  environments:
    linux-python:
      platform:
        os: linux
        architecture: amd64
      runtime:
        adapter: python
        version: "3.12.13"
      baseImage:
        reference: docker.io/library/python:3.12.13-slim@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
      resources:
        cpu: 1
        memory: 256MiB
        disk: 1GiB
        pids: 64

  scenarios:
    quickstart:
      title: Detect an undeclared write then restore
      description: The retained baseline is byte-identical after exercise, but the exercise phase mutates it twice.
      environment: linux-python
      phases:
        setup:
          timeout: 30s
          steps:
            - id: create-declared-baseline
              run:
                command:
                  - python
                  - /workspace/fixture.py
                  - setup
        exercise:
          timeout: 30s
          driver:
            type: cli
            command:
              - python
              - /workspace/fixture.py
              - exercise
            assertions:
              - id: process-exited
                exitCode: 0
              - id: process-reported
                stdoutContains: "completed:write-restore"
              - id: result-created
                fileExists: /outputs/result.json
      capabilities:
        setup:
          network:
            deny: true
          filesystem:
            read:
              - /workspace/**
            write:
              - /outputs/baseline.json
        exercise:
          network:
            deny: true
          filesystem:
            read:
              - /workspace/**
              - /outputs/baseline.json
            write:
              - /outputs/result.json
      verification:
        repeats: 2
        successThreshold: 2
        requiredObservers:
          - process-exec
          - filesystem-write
          - network-enforcement
          - resource-usage
        cleanup:
          allowedResidue:
            - /outputs/**

  policies:
    profile: baseline-v1

  evidence:
    profile: minimal-public
    include:
      - verification-summary
      - normalized-observations
    exclude:
      - raw-stdout
      - raw-stderr
      - raw-syscall-trace
